# Golden-hash update on a pushed golden/** branch (plan sections 6.8 and 10.3): every matrix runner
# regenerates its hash file tests/golden/hashes/<toolchain key>.json, uploads it as an artifact and
# prints it in the job summary; the developer commits the files on that branch (ADR 0021). The
# linux-clang runner also exports the review image set (tools/review/review_set.py) of the branch
# and of main as after/before PNGs.
name: golden-update

on:
  push:
    branches: ["golden/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    name: golden hashes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { name: linux-clang, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, review: true }
          - { name: windows-msvc, os: windows-2025-vs2026, cc: cl, cxx: cl }
          - { name: macos-appleclang, os: macos-15, cc: clang, cxx: clang++ }
          - { name: windows-msvc2022, os: windows-2022, cc: cl, cxx: cl }
          - { name: linux-arm-gcc, os: ubuntu-24.04-arm, cc: gcc-14, cxx: g++-14, packages: g++-14 }
          - { name: macos26-appleclang, os: macos-26, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main for the before images of the review set
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
        with:
          cache-key: ${{ matrix.name }}-release
          packages: ${{ matrix.packages }}

      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release --target wgcli

      - name: Regenerate hashes
        run: |
          key=$(bash tools/ci/toolchain_key.sh build/release)
          echo "Toolchain key: \`$key\`" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f tests/golden/seeds.json ]; then
            echo "::notice::tests/golden/seeds.json does not exist yet; nothing to regenerate."
            echo "No golden seed list yet (arrives with the classic profile, A23)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          wgcli=build/release/tools/wgcli/wgcli
          [ -f "$wgcli.exe" ] && wgcli="$wgcli.exe"
          mkdir -p tests/golden/hashes
          # Seed list format: schema/golden_seeds.schema.json; hashes: ADR 0008.
          "$wgcli" hash --per-stage --seeds tests/golden/seeds.json \
            --out "tests/golden/hashes/$key.json" > /dev/null
          # The file in the summary too, so it can be copied without downloading the artifact.
          {
            echo
            echo "SHA-256: \`$(sha256sum "tests/golden/hashes/$key.json" | cut -d' ' -f1)\`"
            echo
            echo "<details><summary>tests/golden/hashes/$key.json</summary>"
            echo
            echo '```json'
            cat "tests/golden/hashes/$key.json"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload hashes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-${{ matrix.name }}
          path: tests/golden/hashes/
          retention-days: 14
          if-no-files-found: warn

      - name: Review images (after)
        if: matrix.review
        run: |
          python3 tools/review/review_set.py --wgcli build/release/tools/wgcli/wgcli \
            --out review/after --seeds 1..6
      - name: Review images (before, main)
        if: matrix.review
        run: |
          # The same seeds generated by main; skipped while main has no classic profile.
          git worktree add ../main origin/main
          if [ ! -f ../main/data/profiles/classic.json ]; then
            echo "::notice::main has no classic profile yet; no before images."
            exit 0
          fi
          cmake -S ../main -B ../main/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DWG_BUILD_TESTS=OFF -DWG_BUILD_BENCH=OFF -DWG_BUILD_EXAMPLES=OFF
          cmake --build ../main/build --target wgcli
          python3 tools/review/review_set.py --wgcli ../main/build/tools/wgcli/wgcli \
            --out review/before --seeds 1..6
      - name: Upload review images
        if: matrix.review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-png
          path: review/
          retention-days: 14
          if-no-files-found: warn
